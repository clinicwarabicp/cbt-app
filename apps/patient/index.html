<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>CBT記録</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
        background: #f6f7f9; color: #1a1a2e; padding: 16px;
        padding-bottom: calc(16px + env(safe-area-inset-bottom));
      }
      #app { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
      h1 { font-size: 20px; }
      h2 { font-size: 15px; color: #374151; margin-bottom: 8px; }
      a.back { font-size: 14px; color: #2563eb; text-decoration: none; }
      .card { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); display: grid; gap: 10px; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      label { font-size: 13px; color: #444; display: grid; gap: 4px; }
      .row > label { display: flex; align-items: center; gap: 6px; }
      input[type="text"], input[type="date"], input[type="password"], input[type="number"], textarea, select {
        font-size: 16px; padding: 9px 10px; border-radius: 8px; border: 1px solid #ccc; background: #fff; width: 100%;
      }
      .row input[type="text"], .row input[type="date"], .row select { width: auto; flex: 1; min-width: 0; }
      input.num { width: 64px; flex: none; }
      input.sheet { max-width: 110px; }
      input[type="range"] { width: 100%; }
      input[type="checkbox"] { width: 20px; height: 20px; }
      textarea { resize: vertical; }
      button { font-size: 15px; padding: 9px 14px; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
      button.primary { background: #2563eb; color: #fff; border-color: #2563eb; font-weight: 600; }
      button.danger { background: #fff; color: #dc2626; border-color: #dc2626; }
      button:disabled { opacity: .4; }
      .now-button {
        display: grid; gap: 4px; justify-items: center; text-decoration: none; color: #fff;
        background: #2563eb; border-radius: 14px; padding: 22px;
        box-shadow: 0 2px 6px rgba(37,99,235,.35); font-size: 22px;
      }
      .now-button span { font-size: 13px; opacity: .85; }
      button.big { font-size: 18px; padding: 12px 22px; }
      button.link-like { border: none; background: none; color: #2563eb; padding: 4px 0; font-size: 14px; }
      .log-time { font-variant-numeric: tabular-nums; color: #666; margin-right: 4px; }
      .log-note { flex: 1; }
      .kind-chip { font-size: 11px; background: #eef2f7; border-radius: 6px; padding: 3px 6px; color: #475569; flex: none; }
      .hw-row { align-items: baseline; }
      .hw-content { flex: 1; min-width: 160px; }
      .day-chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
      .day-chip {
        font-size: 11px; line-height: 1.4; padding: 4px 6px; border-radius: 8px;
        border: 1px solid #ccc; background: #fff; min-width: 38px;
      }
      .day-chip.checked { background: #ecfdf5; border-color: #059669; color: #047857; font-weight: 700; }
      .day-chip.today { outline: 2px solid #2563eb33; }
      .time-grid { display: grid; gap: 8px; }
      .time-grid-head { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 600; }
      .day-label-chip { font-size: 12px; font-weight: 400; background: #eef2f7; border-radius: 999px; padding: 3px 10px; color: #475569; }
      .time-grid-cells { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
      .time-cell {
        aspect-ratio: 1.6; padding: 0; font-size: 11px; border-radius: 6px;
        border: 1px solid #e3e6ea; background: #fff; color: #b8bec6;
      }
      .time-cell.filled { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600; }
      .menu { display: grid; gap: 8px; }
      .menu-item {
        display: grid; gap: 2px; background: #fff; border-radius: 12px; padding: 14px;
        box-shadow: 0 1px 3px rgba(0,0,0,.08); text-decoration: none; color: inherit;
      }
      .menu-item span { font-size: 12px; color: #666; }
      .banner { background: #eef4ff; border: 1px solid #bfd3ff; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
      .banner.ok { background: #ecfdf5; border-color: #a7f3d0; }
      .banner.err { background: #fef2f2; border-color: #fecaca; }
      .ok { color: #059669; }
      .err { color: #dc2626; font-size: 14px; }
      .note { font-size: 12.5px; color: #666; line-height: 1.6; }
      .name-hint { font-size: 12px; color: #92600a; background: #fffbeb; border-radius: 6px; padding: 5px 8px; }
      .crisis-footer {
        font-size: 13px; line-height: 1.7; background: #fff7ed; border: 1px solid #fed7aa;
        border-radius: 10px; padding: 12px;
      }
      .mood-input { display: grid; gap: 4px; }
      .mood-input .row { justify-content: space-between; }
      .mood-value { font-weight: 700; font-variant-numeric: tabular-nums; }
      .steps { display: flex; gap: 6px; font-size: 13px; }
      .step { color: #999; padding: 4px 8px; border-radius: 6px; }
      .step.active { color: #fff; background: #2563eb; font-weight: 600; }
      .list-item { display: grid; gap: 6px; padding: 8px 0; border-bottom: 1px solid #eee; }
      .example { font-size: 13px; color: #555; background: #f0f0f4; border-radius: 8px; padding: 8px; }
      .pin-input { font-size: 28px; letter-spacing: 12px; text-align: center; width: 160px; justify-self: center; }
      .table-scroll { overflow-x: auto; }
      table { border-collapse: collapse; font-size: 14px; }
      td, th { border: 1px solid #ddd; padding: 5px 9px; text-align: center; white-space: nowrap; }
      tr.today { background: #eef4ff; }
      .check-cell { min-width: 40px; }
      .review-row { padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
      .review-notes { display: grid; gap: 2px; font-size: 12.5px; color: #555; margin-top: 3px; }
      .file-label { position: relative; overflow: hidden; display: inline-block; padding: 9px 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; color: #1a1a2e; }
      .file-label input { position: absolute; inset: 0; opacity: 0; }
      .qr-wrap { justify-items: center; }
      canvas { max-width: 100%; height: auto; image-rendering: pixelated; }
      .frame-indicator { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .stats { font-size: 13px; color: #444; line-height: 1.7; }
      details pre { font-size: 10px; overflow-x: auto; background: #f0f0f4; padding: 8px; border-radius: 8px; }
      details summary { font-size: 13px; color: #555; cursor: pointer; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
